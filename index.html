
<style>
/* Icônes raffinées du Compagnon Magique */

.menu-card .icon.large {
  width: 53px;
  height: 53px;
}

.menu-card .icon.large svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: white;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const icons = {

    /* LOUPE MAIN STREET */
    explore: `
      <svg viewBox="0 0 64 64"
           xmlns="http://www.w3.org/2000/svg">
        <circle cx="27" cy="27" r="17"/>
        <path d="M39 39L55 55"/>
        <path d="M18 27H36M27 18V36"
              opacity=".7"/>
        <path d="M45 9V17M41 13H49"/>
        <path d="M52 23V29M49 26H55"/>
        <circle cx="12" cy="49" r="1.5"
                fill="white" stroke="none"/>
      </svg>
    `,

    /* FEU D'ARTIFICE */
    schedule: `
      <svg viewBox="0 0 64 64"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8V20M32 36V48
                 M12 28H24M40 28H52
                 M18 14L26 22
                 M38 34L46 42
                 M46 14L38 22
                 M26 34L18 42"/>
        <path d="M32 20L35 25L41 28
                 L35 31L32 36L29 31
                 L23 28L29 25Z"/>
        <path d="M11 51L14 46L17 51
                 L22 54L17 57L14 62
                 L11 57L6 54Z"
              transform="translate(0,-5) scale(.8)"/>
        <path d="M49 44L51 49L56 51
                 L51 53L49 58L47 53
                 L42 51L47 49Z"/>
        <circle cx="10" cy="13" r="2"/>
        <circle cx="53" cy="10" r="2"/>
        <circle cx="55" cy="36" r="1.5"/>
      </svg>
    `,

    /* SPACE MOUNTAIN : CANON, RAILS, LUNE */
    space: `
      <svg viewBox="0 0 80 64"
           xmlns="http://www.w3.org/2000/svg">
        <!-- Lune -->
        <circle cx="65" cy="12" r="8"/>
        <path d="M62 9L65 12L63 15"
              opacity=".6"/>

        <!-- Canon Columbiad -->
        <path d="M8 18L25 31L18 39L2 26Z"/>
        <path d="M7 29L2 36M14 34L12 42"/>
        <path d="M9 18L7 12"/>

        <!-- Étoiles -->
        <path d="M37 8V16M33 12H41"/>
        <path d="M48 21V27M45 24H51"/>

        <!-- Rails avec looping -->
        <path d="
          M3 53
          C16 53 20 42 27 37
          C34 31 38 43 38 47
          C38 57 53 57 53 43
          C53 30 43 30 43 43
          C43 51 49 51 55 42
          C63 29 70 31 78 21
        "/>

        <!-- Rail inférieur -->
        <path d="
          M3 59
          C17 59 23 47 29 43
          M57 49
          C65 37 72 37 78 28
        " opacity=".6"/>

        <!-- Supports -->
        <path d="M14 50V61
                 M27 42V61
                 M61 39V61
                 M72 31V61"
              opacity=".55"/>

        <!-- Train -->
        <path d="M19 43L24 39L32 40L36 45"/>
        <circle cx="25" cy="38" r="1.4"
                fill="white" stroke="none"/>
        <circle cx="30" cy="38" r="1.4"
                fill="white" stroke="none"/>
      </svg>
    `
  };

  const replacements = [
    ["explore", icons.explore],
    ["schedule", icons.schedule],
    ["space", icons.space]
  ];

  replacements.forEach(function(item) {
    const button = document.querySelector(
      '.menu-card[data-go="' + item[0] + '"]'
    );

    if (!button) return;

    const icon = button.querySelector(".icon.large");

    if (icon) {
      icon.innerHTML = item[1];
    }
  });

});
</script>
